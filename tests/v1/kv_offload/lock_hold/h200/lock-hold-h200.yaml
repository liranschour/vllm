apiVersion: v1
kind: Pod
metadata:
  annotations:
    gpu-reaper.io/exclude: 'True'
  labels:
    anti-affinity-group: lockhold
    app: lock-hold-h200
    gpu-reaper.io/exclude: 'True'
  name: lock-hold-h200
  namespace: default
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: gpu.nvidia.com/model
            operator: In
            values:
            - H200
          - key: kubernetes.io/hostname
            operator: NotIn
            values:
            - gf48cf2
            - gd91fda
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            anti-affinity-group: lockhold
        topologyKey: kubernetes.io/hostname
  containers:
  - command:
    - /bin/sh
    - -c
    - sleep infinity
    env:
    - name: UCX_LOG_LEVEL
      value: warn
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          key: HF_TOKEN
          name: llm-d-hf-token
    image: vllm/vllm-openai:nightly
    imagePullPolicy: Always
    name: lock-hold-h200
    resources:
      limits:
        cpu: '32'
        memory: 250Gi
        nvidia.com/gpu: 1
      requests:
        cpu: '32'
        memory: 250Gi
        nvidia.com/gpu: 1
    securityContext:
      capabilities:
        add:
        - IPC_LOCK
        - SYS_RAWIO
      runAsUser: 0
    volumeMounts:
    - mountPath: /dev/shm
      name: dshm
  priorityClassName: nightly-gpu-critical
  serviceAccountName: default
  volumes:
  - emptyDir:
      medium: Memory
    name: dshm
